<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Instituto Raízes</title>
  <meta name="description" content="Cadastre-se para ser voluntário ou doador do Instituto Raízes.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <p>Instituto Raízes</p>
    <nav>
      <ul>
        <li><a href="../index.html">Início</a></li>
        <li><a href="sobre.html">Sobre nós</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Cadastro</h1>
    <p>Preencha os dados abaixo para se juntar ao Instituto Raízes. Todos os campos são obrigatórios.</p>

    <form action="#" method="post">

      <fieldset>
        <legend>Dados pessoais</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required>

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric"
               placeholder="000.000.000-00" maxlength="14"
               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
               title="Digite o CPF no formato 000.000.000-00" required>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email"
               placeholder="nome@exemplo.com" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" inputmode="tel"
               placeholder="(00) 00000-0000" maxlength="15"
               pattern="\(\d{2}\) \d{4,5}-\d{4}"
               title="Digite o telefone no formato (00) 00000-0000" required>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" inputmode="numeric"
               placeholder="00000-000" maxlength="9"
               pattern="\d{5}-\d{3}"
               title="Digite o CEP no formato 00000-000" required>

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="estado">Estado (sigla)</label>
        <input type="text" id="estado" name="estado" maxlength="2"
               placeholder="GO" pattern="[A-Za-z]{2}"
               title="Digite a sigla do estado com 2 letras" required>
      </fieldset>

      <fieldset>
        <legend>Como você quer ajudar?</legend>

        <input type="radio" id="voluntario" name="perfil" value="voluntario" required>
        <label for="voluntario">Quero ser voluntário</label>

        <input type="radio" id="doador" name="perfil" value="doador">
        <label for="doador">Quero ser doador</label>
      </fieldset>

      <p>
        <input type="checkbox" id="consentimento" name="consentimento" required>
        <label for="consentimento">Autorizo o uso dos meus dados para contato da ONG.</label>
      </p>

      <button type="submit">Enviar cadastro</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Instituto Raízes. Todos os direitos reservados.</p>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
